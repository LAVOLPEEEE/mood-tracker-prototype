<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Муд-трекер с котиком — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pbox" id="pbox"><div class="phone" id="phone"><div class="notch"></div><div id="app"></div></div></div>

<aside class="side" aria-label="Управление прототипом">
  <h3>Прототип муд-трекера</h3>
  <p>Кликабельный сценарий: онбординг, ежедневный чек-ин, рекомендация или поддержка, затем вопрос при повторном входе и еженедельный опрос.</p>
  <div class="list">
    <button data-jump="welcome">1. Онбординг<small>Блок 1 · первый запуск</small></button>
    <button data-jump="daily">2. Ежедневные вопросы<small>Блок 2 · 1–5 слайдеры, 6–8 свайпы</small></button>
    <button data-jump="reenter">3. Повторный вход<small>Блок 3 · «Помогла ли рекомендация?»</small></button>
    <button data-jump="weekly">4. Еженедельный опрос<small>Блок 4 · 1 раз в неделю</small></button>
    <button data-jump="home">Главный экран</button>
  </div>
  <p class="note" style="margin-top:18px;font-weight:800;color:var(--text)">Пол пользователя (меняет тексты)</p>
  <div class="seg" id="gseg"><button data-g="m">Мужской</button><button data-g="f">Женский</button></div>
  <p class="note" style="font-weight:800;color:var(--text)">Формат ввода</p>
  <div class="seg" id="fseg"><button data-f="opt">Выбор из опций</button><button data-f="text">Свой текст</button></div>
</aside>
<button class="fab" id="fab" aria-label="Меню прототипа"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="fablbl">Сценарии</span></button>

<script src="script.js"></script>
</body>
</html>
